server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls if relative
    location /api/ {
        proxy_pass https://securemailscope-backend-454069237379.us-central1.run.app/api/;
        proxy_set_header Host securemailscope-backend-454069237379.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }
}
